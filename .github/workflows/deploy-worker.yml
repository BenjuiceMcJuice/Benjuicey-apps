name: Deploy Worker

# The feedback Worker used to be the one piece of this repo that needed a
# terminal (`cd worker && npx wrangler deploy`), so it could silently fall
# behind the Pages site — which deploys itself on every push to main. This
# closes that gap and makes a deploy runnable from a phone.
#
# Three ways to run it:
#   1. automatically, when a push to main touches the Worker
#   2. Actions tab → "Deploy Worker" → "Run workflow" (works in a mobile browser)
#   3. ask Claude Code to dispatch it
#
# Needs one repo secret: CLOUDFLARE_API_TOKEN (see docs/feedback-how-it-works.md
# → "Deploying the Worker"). Worker secrets (GOOGLE_SERVICE_ACCOUNT_JSON,
# RESEND_API_KEY, ADMIN_PASSWORD) live in Cloudflare and a deploy leaves them
# alone.

on:
  push:
    branches: [main]
    paths:
      # `lib/` matters too — the Worker imports lib/status.ts, so a change to
      # the status model or auto-close policy needs a Worker deploy.
      - 'worker/**'
      - 'lib/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate only — do not deploy'
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci
        working-directory: worker

      # Cheap guard: a Worker that doesn't typecheck should never ship.
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: worker

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed if the token can see more than one account; harmless
          # (and ignored) when the secret isn't set.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Dry run (build only)
        if: ${{ inputs.dry_run }}
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
        working-directory: worker

      - name: Summary
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Worker dry run ✅"
              echo "Bundled and typechecked — nothing deployed."
            else
              echo "### Worker deployed ✅"
              echo "\`benjuicey-feedback\` is live with this commit, including the"
              echo "nightly status sweep cron from \`wrangler.toml\`."
            fi
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
