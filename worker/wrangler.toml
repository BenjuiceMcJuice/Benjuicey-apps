name = "benjuicey-feedback"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Nightly status sweep (03:30 UTC): tickets that have been `resolved` for
# longer than the 7-day auto-close window become `closed`. The admin
# dashboard's GET also sweeps, so this only matters for stretches where
# nobody opens it. See `worker/src/sweep.ts`.
[triggers]
crons = ["30 3 * * *"]

[vars]
FIRESTORE_PROJECT_ID = "benjuicey-apps"
# Where new-feedback notification emails go, via Resend. While Resend is in
# test mode (onboarding@resend.dev sender), this MUST be the email your Resend
# account was created with, or delivery is rejected. Change freely.
ADMIN_EMAIL = "benjuice.apps@gmail.com"
# NOTE: Formspree was tried as a zero-setup notification channel and retired —
# it spam-filters every server-side POST from the Worker, so no email ever
# fires (see DEVLOG 2026-07-14 session 2). Resend replaces it.
# Update ALLOWED_ORIGINS once your Cloudflare Pages URL is known
ALLOWED_ORIGINS = "https://benjuicey-apps.pages.dev,http://localhost:3000,http://localhost:5173,https://aisense.pages.dev,https://ai-literate.pages.dev,https://ai-literate.uk,https://www.ai-literate.uk,https://whatadisaster.pages.dev,https://whatadisaster.uk,https://www.whatadisaster.uk,https://betalog.co.uk,https://www.betalog.co.uk,https://betalog.pages.dev"

# Set these secrets via the CLI (run once each):
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
#   wrangler secret put RESEND_API_KEY   # a real re_… key turns notifications on
