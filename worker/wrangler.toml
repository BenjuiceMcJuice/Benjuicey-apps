name = "benjuicey-feedback"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
FIRESTORE_PROJECT_ID = "benjuicey-apps"
# Where new-feedback notification emails go. While Resend is in test mode
# (onboarding@resend.dev sender), this MUST be the email your Resend
# account was created with, or delivery is rejected. Change freely.
ADMIN_EMAIL = "benjuice.apps@gmail.com"
# Update ALLOWED_ORIGINS once your Cloudflare Pages URL is known
ALLOWED_ORIGINS = "https://benjuicey-apps.pages.dev,http://localhost:3000,http://localhost:5173,https://aisense.pages.dev,https://ai-literate.pages.dev,https://ai-literate.uk,https://www.ai-literate.uk,https://whatadisaster.pages.dev,https://whatadisaster.uk,https://www.whatadisaster.uk,https://betalog.co.uk,https://www.betalog.co.uk,https://betalog.pages.dev"

# Set these secrets via the CLI (run once each):
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
#   wrangler secret put RESEND_API_KEY
